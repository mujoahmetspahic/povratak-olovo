<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracija POVRATAK</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><main><a class="brand" href="/">POVRATAK <small>ADMINISTRACIJA SADRŽAJA</small></a>
<section id="login" class="panel"><h1>Prijava administratora</h1><form id="login-form"><label>Administratorska lozinka<input id="password" type="password" autocomplete="current-password" required></label><button class="btn">Prijava</button><p id="login-msg"></p></form></section>
<section id="dashboard" class="panel" hidden><div class="between"><h1>Administracija POVRATAK</h1><button id="logout" class="btn secondary">Odjava</button></div>
<form id="item-form"><input id="id" type="hidden"><label>Vrsta<select id="kind"><option value="news">Vijest</option><option value="project">Projekat</option></select></label><label>Naslov<input id="title" required maxlength="160"></label><label>Kategorija<input id="category" maxlength="80" placeholder="SPORT, OKOLIŠ, ZAJEDNICA"></label><label>Kratki opis<textarea id="summary" maxlength="500"></textarea></label><label>Tekst<textarea id="body" rows="5" maxlength="10000"></textarea></label><label>URL fotografije (opcionalno)<input id="image" placeholder="https://..."></label><label><input id="published" type="checkbox" checked> Objavljeno</label><button class="btn">Sačuvaj</button> <button id="new" class="btn secondary" type="button">Nova objava</button><p id="form-msg"></p></form><h2>Postojeće objave</h2><div id="items"></div></section>
<p class="note">Administracija se može koristiti tek nakon što Cloudflare Worker, D1 baza i tajne vrijednosti budu konfigurirani.</p></main><script src="/app.js"></script></body></html>
